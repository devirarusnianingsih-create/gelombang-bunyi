<style>
:root{--lav:#e8dcff;--purple:#6f4aa8;--deep:#382452;--pink:#ffd9e8;--peach:#ffe0cc;--cream:#fff6e9;--white:#fff;--ink:#382b46;--muted:#75677f;--line:#eadff2;--shadow:0 14px 38px #4b2d6714}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#fffcff;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,70px);background:#fffdfbf0;border-bottom:1px solid #efe5f5;position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}.brand{display:flex;align-items:center;gap:11px;font-weight:900;letter-spacing:.06em;color:var(--deep)}.brand-mark{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg,var(--purple),#b28be5);display:grid;place-items:center;color:white;font-size:23px;box-shadow:0 8px 20px #6f4aa833}.brand small{display:block;font-size:10px;letter-spacing:.14em;color:#927ea7}.nav{display:flex;gap:10px;align-items:center}.nav button,.ghost{background:transparent;color:var(--deep);padding:10px 14px;border-radius:13px;font-weight:750}.nav button:hover,.ghost:hover{background:var(--lav)}.primary{background:var(--purple);color:white;padding:13px 20px;border-radius:14px;font-weight:850;box-shadow:0 8px 20px #6f4aa82e;transition:.2s}.primary:hover{transform:translateY(-2px);background:#593788}.secondary{background:white;border:1px solid var(--line);color:var(--deep);padding:12px 17px;border-radius:13px;font-weight:800}.secondary:hover{background:var(--cream)}.wrap{max-width:1180px;margin:auto;padding:32px 22px 72px}.hero{display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:32px;padding:46px 0 34px}.eyebrow{display:inline-flex;gap:8px;align-items:center;background:var(--pink);color:#7d3c66;border-radius:999px;padding:7px 13px;font-size:12px;font-weight:850;letter-spacing:.08em}.hero h1{font-size:clamp(38px,5.5vw,68px);line-height:1.05;letter-spacing:-.045em;color:var(--deep);margin:18px 0}.hero h1 span{color:var(--purple)}.hero p{font-size:17px;color:var(--muted);max-width:590px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:25px}.hero-art{position:relative;min-height:390px;border-radius:35px;background:radial-gradient(circle at 70% 20%,#fff8e8 0 12%,transparent 13%),linear-gradient(145deg,#f2e8ff,#ffdfeb 56%,#ffe8d8);overflow:hidden;display:grid;place-items:center;box-shadow:var(--shadow)}.hero-art:before,.hero-art:after{content:"";position:absolute;border:2px solid #9872c966;border-radius:50%;width:260px;height:260px;animation:pulse 3.5s ease-out infinite}.hero-art:after{animation-delay:1.5s}.speaker{z-index:2;width:130px;height:170px;border-radius:24px;background:linear-gradient(140deg,#65458b,#3f2a5a);box-shadow:0 20px 35px #39244b44;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transform:rotate(-7deg)}.speaker .cone{border-radius:50%;background:radial-gradient(circle,#f9d7e7 0 12%,#b68add 14% 26%,#5a3c79 29% 100%);width:68px;height:68px;border:4px solid #d4b6f2}.speaker .dot{width:12px;height:12px;border-radius:50%;background:#f8d3e5}.float{position:absolute;background:#fffdf2e8;padding:12px 15px;border-radius:17px;box-shadow:var(--shadow);font-weight:800;font-size:13px;animation:float 4s ease-in-out infinite}.f1{top:18%;left:9%}.f2{right:7%;top:31%;animation-delay:.8s}.f3{bottom:15%;left:15%;animation-delay:1.3s}.wave-line{position:absolute;bottom:20px;width:100%;height:90px;opacity:.65}.section-head{display:flex;justify-content:space-between;align-items:end;gap:18px;margin:45px 0 20px}.section-head h2{font-size:clamp(25px,3vw,36px);line-height:1.15;margin:0;color:var(--deep)}.section-head p{color:var(--muted);margin:8px 0 0}.progress-summary{font-size:12px;font-weight:800;background:var(--cream);padding:10px 14px;border-radius:14px;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.lesson-card{border:1px solid var(--line);border-radius:25px;padding:22px;background:white;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:370px;transition:transform .25s,box-shadow .25s;overflow:hidden;position:relative}.lesson-card:hover{transform:translateY(-6px);box-shadow:0 20px 40px #4b2d6720}.lesson-card.l1{background:linear-gradient(155deg,#fff 30%,#f0e7ff)}.lesson-card.l2{background:linear-gradient(155deg,#fff 30%,#ffe3ed)}.lesson-card.l3{background:linear-gradient(155deg,#fff 30%,#fff0dd)}.card-top{display:flex;justify-content:space-between;align-items:center}.number{width:44px;height:44px;border-radius:15px;background:#fff;display:grid;place-items:center;color:var(--purple);font-weight:950;box-shadow:0 4px 15px #50376b12}.card-emoji{font-size:35px}.lesson-card h3{font-size:20px;line-height:1.25;margin:18px 0 9px;color:var(--deep)}.lesson-card p{color:var(--muted);font-size:14px;margin:0 0 14px}.lesson-card ul{padding-left:19px;margin:0 0 20px;font-size:13px;color:#63566e}.lesson-card li{margin:5px 0}.lesson-card .primary{margin-top:auto;width:100%}.pill{display:inline-flex;border-radius:999px;background:#fff;padding:6px 10px;font-size:11px;font-weight:850;color:#75519b;width:max-content}.footer{padding:24px;text-align:center;color:var(--muted);border-top:1px solid var(--line);font-size:12px}.page-head{padding:25px 0 26px}.crumb{font-size:13px;color:var(--muted);margin-bottom:14px}.crumb button{background:none;color:var(--purple);font-weight:800;padding:0}.lesson-banner{border-radius:28px;padding:28px;display:flex;justify-content:space-between;align-items:center;gap:20px;overflow:hidden}.lesson-banner.l1{background:linear-gradient(120deg,#eee3ff,#f9f3ff)}.lesson-banner.l2{background:linear-gradient(120deg,#ffe0eb,#fff0df)}.lesson-banner.l3{background:linear-gradient(120deg,#fff0dc,#eee3ff)}.lesson-banner h1{font-size:clamp(28px,4vw,43px);line-height:1.12;margin:8px 0;color:var(--deep)}.lesson-banner p{margin:0;color:#6f607b;max-width:700px}.banner-icon{font-size:68px;min-width:90px;text-align:center;animation:float 4s ease-in-out infinite}.progress-track{height:8px;background:#eee5f5;border-radius:99px;overflow:hidden;margin:18px 0 0}.progress-fill{height:100%;background:linear-gradient(90deg,#9c76cb,#eaa9c8);border-radius:99px;transition:width .3s}.lesson-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;margin-top:24px;align-items:start}.side-nav{position:sticky;top:96px;background:white;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow)}.side-nav h4{margin:5px 8px 12px;color:var(--deep)}.side-nav button{display:block;width:100%;text-align:left;background:transparent;color:#766781;padding:10px 12px;border-radius:11px;font-size:13px;font-weight:750;margin:3px 0}.side-nav button:hover,.side-nav button.active{background:var(--lav);color:var(--deep)}.content{min-width:0}.panel{background:white;border:1px solid var(--line);border-radius:23px;padding:25px;margin-bottom:18px;box-shadow:var(--shadow);scroll-margin-top:100px}.panel h2{font-size:23px;color:var(--deep);margin:0 0 10px;line-height:1.25}.panel h3{color:var(--deep);margin:20px 0 7px}.panel p{color:#675a72}.panel ul,.panel ol{color:#675a72}.callout{background:var(--cream);border-left:4px solid #e6b18c;padding:14px 16px;border-radius:0 13px 13px 0;color:#5d4b60;margin:16px 0}.formula{background:#f5efff;border-radius:16px;text-align:center;padding:18px;color:var(--deep);font-size:clamp(18px,2.5vw,26px);font-weight:850;letter-spacing:.02em;margin:16px 0}.two-col{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.mini-card{background:#fff9f4;border:1px solid #f3e5eb;border-radius:17px;padding:16px}.mini-card strong{color:var(--deep)}.sim{background:linear-gradient(145deg,#f4ebff,#fff0f4);border-radius:20px;padding:20px;overflow:hidden}.sim-controls{display:flex;flex-wrap:wrap;gap:14px;align-items:center;margin:12px 0}.sim-controls label{font-size:13px;font-weight:750;color:var(--deep);display:grid;gap:5px;min-width:130px;flex:1}.sim-controls input[type=range]{width:100%;accent-color:var(--purple)}.sim-controls select,.sim-controls input[type=number]{border:1px solid #e0d3ed;border-radius:10px;padding:8px;background:white;color:var(--deep)}.visual-stage{min-height:180px;background:#fffdfd;border-radius:16px;display:grid;place-items:center;position:relative;overflow:hidden;margin-top:12px}.wave-svg{width:100%;height:170px}.stat-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}.stat{background:#fff;border:1px solid #e9dff0;border-radius:13px;padding:10px 13px;font-size:12px;color:var(--muted)}.stat b{display:block;color:var(--deep);font-size:18px}.calc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.calc-grid label{font-size:12px;font-weight:800;color:var(--deep)}.calc-grid input{display:block;width:100%;margin-top:5px;padding:10px;border:1px solid var(--line);border-radius:10px}.quiz-q{padding:15px;border:1px solid var(--line);border-radius:16px;margin:12px 0}.quiz-q p{margin:0 0 10px;font-weight:800;color:var(--deep)}.quiz-q label{display:block;padding:7px 10px;border-radius:9px;color:#685b73;cursor:pointer}.quiz-q label:hover{background:#f8f1ff}.feedback{padding:12px 14px;border-radius:12px;margin-top:12px;font-weight:750;font-size:14px}.good{background:#f1eaff;color:#4f3476}.bad{background:#fff0e6;color:#8b4b34}.activity{display:grid;gap:12px}.activity label{font-weight:750;font-size:14px;color:var(--deep)}.activity input,.activity textarea{width:100%;margin-top:6px;border:1px solid var(--line);border-radius:12px;padding:12px;resize:vertical}.activity textarea{min-height:85px}.notice{font-size:12px;color:var(--muted)}.page-nav{display:flex;justify-content:space-between;gap:12px;margin:22px 0}.page-nav button{max-width:49%}.hidden{display:none!important}.eval-card{max-width:800px;margin:20px auto}.camera-box{position:relative;min-height:260px;background:#342344;border-radius:18px;overflow:hidden;display:grid;place-items:center;color:white;text-align:center;padding:20px}.camera-box video{position:absolute;width:100%;height:100%;object-fit:cover;inset:0}.camera-overlay{position:absolute;inset:0;pointer-events:none}.camera-caption{position:relative;z-index:2;background:#382452bb;padding:14px;border-radius:15px;max-width:85%}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--deep);color:white;padding:12px 18px;border-radius:13px;box-shadow:var(--shadow);z-index:99;font-size:13px}.small-link{color:var(--purple);font-weight:800;text-decoration:none}.badge{font-size:11px;font-weight:850;color:#76539b;background:#f3eaff;padding:6px 10px;border-radius:99px}
@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.7);opacity:0}}@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes ripple{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.5);opacity:0}}
@media(max-width:850px){.hero{grid-template-columns:1fr;padding-top:25px}.hero-art{min-height:300px}.cards{grid-template-columns:1fr 1fr}.lesson-layout{grid-template-columns:1fr}.side-nav{position:static;display:flex;flex-wrap:wrap;gap:4px}.side-nav h4{width:100%}.side-nav button{width:auto;flex:1}.banner-icon{font-size:48px}.nav .optional{display:none}}
@media(max-width:570px){.topbar{height:65px;padding:0 14px}.brand{font-size:13px}.brand-mark{width:36px;height:36px}.nav button{padding:8px;font-size:12px}.wrap{padding:20px 14px 48px}.hero h1{font-size:42px}.hero-art{min-height:260px}.cards{grid-template-columns:1fr}.lesson-card{min-height:320px}.section-head{align-items:start;flex-direction:column}.lesson-banner{padding:22px}.banner-icon{display:none}.panel{padding:18px}.two-col{grid-template-columns:1fr}.calc-grid{grid-template-columns:1fr}.page-nav{flex-direction:column}.page-nav button{max-width:100%;width:100%}}

<body><div id="app" class="app"></div>
<script>
const lessons={
1:{title:"Sumber Bunyi dan Cepat Rambat Bunyi",short:"Kenali asal bunyi, medium perambatan, dan bagaimana gelombang bunyi bergerak.",icon:"🔔",theme:"l1",accent:"Lavender",topics:["Apersepsi","Tujuan belajar","Materi inti","Simulasi gelombang","Contoh soal","LKPD mini","Kuis","Refleksi"],intro:"Mengapa kita dapat mendengar bel sekolah dari kejauhan, tetapi tidak dapat mendengar suara di ruang hampa?",objectives:["Mengidentifikasi sumber bunyi sebagai benda yang bergetar.","Menjelaskan bahwa bunyi memerlukan medium untuk merambat.","Menghubungkan frekuensi, panjang gelombang, dan cepat rambat bunyi."],material:`<p>Bunyi adalah gelombang mekanik yang berasal dari getaran benda. Ketika penggaris dijepit di tepi meja lalu ujungnya digetarkan, penggaris bergetar dan mengganggu partikel udara di sekitarnya. Gangguan itu merambat sebagai rapatan dan renggangan.</p><h3>Bunyi membutuhkan medium</h3><p>Bunyi dapat merambat melalui gas, cairan, dan zat padat. Partikel medium meneruskan gangguan ke partikel di dekatnya; partikelnya tidak ikut berpindah jauh bersama gelombang. Karena ruang hampa hampir tidak memiliki partikel, bunyi tidak dapat merambat di sana.</p><h3>Frekuensi, panjang gelombang, dan cepat rambat</h3><p>Frekuensi adalah banyak getaran tiap sekon (Hz), sedangkan panjang gelombang adalah jarak antara dua rapatan berurutan (m). Cepat rambat bergantung pada sifat medium dan keadaan medium.</p>`,formula:"v = f × λ",example:"Sebuah bunyi memiliki frekuensi 500 Hz dan panjang gelombang 0,68 m di udara. Berapa cepat rambatnya?",answer:"Diketahui f = 500 Hz dan λ = 0,68 m. v = fλ = 500 × 0,68 = 340 m/s.",quiz:[{q:"Benda dapat menghasilkan bunyi ketika…",a:["Bergetar","Diam sempurna","Berubah warna","Tidak berinteraksi"],c:0,e:"Sumber bunyi bergetar dan getarannya mengganggu medium."},{q:"Bunyi tidak dapat merambat di ruang hampa karena…",a:["Tidak ada cahaya","Tidak ada medium untuk meneruskan getaran","Suhunya selalu rendah","Frekuensinya nol"],c:1,e:"Gelombang bunyi merupakan gelombang mekanik yang memerlukan medium."},{q:"Jika f = 200 Hz dan λ = 1,5 m, cepat rambat bunyi adalah…",a:["75 m/s","200 m/s","300 m/s","1.700 m/s"],c:2,e:"v = fλ = 200 × 1,5 = 300 m/s."}]},
2:{title:"Resonansi dan Efek Doppler",short:"Amati penguatan getaran dan perubahan frekuensi ketika sumber atau pendengar bergerak.",icon:"🎻",theme:"l2",accent:"Pink & Peach",topics:["Apersepsi","Tujuan belajar","Materi inti","Simulasi resonansi","Simulasi Doppler","Contoh soal","LKPD mini","Kuis","Refleksi"],intro:"Mengapa badan gitar ikut bergetar saat senarnya dipetik? Mengapa sirene ambulans terdengar lebih tinggi saat mendekat dan lebih rendah saat menjauh?",objectives:["Menjelaskan resonansi sebagai respons kuat saat frekuensi pemaksa sesuai frekuensi alami.","Membedakan frekuensi sumber dan frekuensi yang didengar.","Memprediksi perubahan frekuensi pada efek Doppler."],material:`<p><b>Resonansi</b> terjadi ketika suatu sistem mendapat getaran berkala dengan frekuensi yang sama atau mendekati frekuensi alaminya. Energi ditransfer dengan efektif sehingga amplitudo getaran dapat membesar. Contoh: rongga gitar membantu memperkuat bunyi senar.</p><p><b>Efek Doppler</b> adalah perubahan frekuensi yang terdengar akibat gerak relatif antara sumber bunyi dan pendengar. Ketika sumber mendekat, gelombang di depan sumber menjadi lebih rapat sehingga frekuensi terdengar lebih tinggi. Ketika menjauh, gelombang lebih renggang dan frekuensi terdengar lebih rendah.</p><div class="callout">Konvensi sederhana: untuk sumber bergerak dan pendengar diam, mendekat → frekuensi terdengar naik; menjauh → frekuensi terdengar turun.</div>`,formula:"f′ = f × v / (v ∓ vₛ)",example:"Sirene 600 Hz mendekati pendengar dengan kecepatan 20 m/s. Jika cepat rambat bunyi 340 m/s, perkiraan frekuensi yang terdengar?",answer:"Untuk sumber mendekat, penyebut v − vₛ. f′ = 600 × 340 / (340 − 20) = 204.000/320 = 637,5 Hz.",quiz:[{q:"Resonansi paling kuat terjadi ketika…",a:["Frekuensi pemaksa mendekati frekuensi alami","Benda tidak memiliki massa","Suhu selalu nol","Tidak ada getaran"],c:0,e:"Kecocokan frekuensi memungkinkan transfer energi yang efektif."},{q:"Sirene bergerak mendekati pendengar diam. Frekuensi terdengar umumnya…",a:["Lebih rendah","Tetap nol","Lebih tinggi","Tidak bisa didengar"],c:2,e:"Gelombang di depan sumber bergerak menjadi lebih rapat."},{q:"Efek Doppler berkaitan dengan…",a:["Perubahan warna benda","Gerak relatif sumber dan pendengar","Massa jenis saja","Pemantulan cahaya"],c:1,e:"Gerak relatif mengubah frekuensi yang diterima pendengar."}]},
3:{title:"Intensitas dan Taraf Intensitas Bunyi",short:"Pelajari daya bunyi per luas, skala desibel, dan pengaruh jarak dari sumber.",icon:"📢",theme:"l3",accent:"Cream & Lavender",topics:["Apersepsi","Tujuan belajar","Materi inti","Simulasi intensitas","Contoh soal","LKPD mini","Kuis","Refleksi"],intro:"Mengapa suara speaker terasa lebih lemah ketika kita berjalan menjauh? Apakah bunyi 80 dB dua kali lebih keras daripada 40 dB?",objectives:["Mendefinisikan intensitas bunyi sebagai daya per satuan luas.","Menghitung taraf intensitas bunyi dalam desibel.","Menganalisis pengaruh jarak terhadap intensitas sumber titik ideal."],material:`<p><b>Intensitas bunyi (I)</b> adalah daya bunyi yang melewati tiap satuan luas tegak lurus arah rambat. Satuannya W/m². Untuk sumber titik yang memancarkan daya merata ke segala arah, intensitas berkurang saat jarak bertambah.</p><h3>Taraf intensitas bunyi</h3><p>Karena rentang intensitas yang dapat didengar sangat lebar, digunakan skala logaritmik desibel (dB). Intensitas acuan yang umum dipakai di udara adalah I₀ = 10⁻¹² W/m².</p>`,formula:"I = P / (4πr²)   •   β = 10 log₁₀(I / I₀)",example:"Intensitas bunyi 10⁻⁶ W/m². Berapa taraf intensitasnya jika I₀ = 10⁻¹² W/m²?",answer:"β = 10 log₁₀(10⁻⁶/10⁻¹²) = 10 log₁₀(10⁶) = 60 dB.",quiz:[{q:"Satuan intensitas bunyi adalah…",a:["W/m²","Hz","m/s","J/kg"],c:0,e:"Intensitas adalah daya dibagi luas."},{q:"Jika intensitas menjadi 10 kali, taraf intensitas berubah sebesar…",a:["1 dB","10 dB","20 dB","100 dB"],c:1,e:"β = 10 log₁₀(I/I₀); faktor 10 menambah 10 dB."},{q:"Untuk sumber titik ideal, jika jarak menjadi dua kali, intensitas menjadi…",a:["Dua kali","Empat kali","Setengah","Seperempat"],c:3,e:"I berbanding terbalik dengan kuadrat jarak: 1/2² = 1/4."}]}
};
let quizResults={}, doneLessons=new Set(JSON.parse(localStorage.getItem("soundlab_done")||"[]")), quizScores=JSON.parse(localStorage.getItem("soundlab_scores")||"{}");
let cameraStream=null;
function path(){let p=location.pathname.replace(/\/+$/,"")||"/";return p}
function go(p){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}history.pushState({}, "",p);render();window.scrollTo(0,0)}
window.addEventListener("popstate",render);
function saveDone(n){doneLessons.add(n);localStorage.setItem("soundlab_done",JSON.stringify([...doneLessons]));}
function progress(){return Math.round(doneLessons.size/3*100)}
function header(){return `<header class="topbar"><div class="brand"><div class="brand-mark">〰</div><div>SOUNDLAB AR<small>FISIKA • GELombang bunyi</small></div></div><nav class="nav"><button class="optional" onclick="go('/')">Beranda</button><button onclick="go('/evaluasi')">Evaluasi</button><button onclick="go('/refleksi')">Refleksi</button></nav></header>`}
function footer(){return `<footer class="footer">SOUNDLAB AR · Belajar bunyi melalui eksplorasi, simulasi, dan refleksi.<br>Model simulasi bersifat edukatif; hasil ideal dapat berbeda dari kondisi nyata.</footer>`}
function card(n){let l=lessons[n];return `<article class="lesson-card ${l.theme}"><div class="card-top"><span class="number">0${n}</span><span class="card-emoji">${l.icon}</span></div><span class="pill">PERTEMUAN ${n}</span><h3>${l.title.toUpperCase()}</h3><p>${l.short}</p><ul>${l.objectives.slice(0,3).map(x=>`<li>${x}</li>`).join("")}</ul><button class="primary" onclick="go('/pertemuan-${n}')">PELAJARI SEKARANG ↗</button><p class="notice" style="margin-top:10px">${doneLessons.has(n)?"✓ Sudah dipelajari":"Belum selesai"}</p></article>`}

ass="mini-card"><strong>🔎 1. Eksplorasi</strong><p>Mulai dari pertanyaan sehari-hari dan temukan konsep fisikanya.</p></div><div class="mini-card"><strong>🧪 2. Simulasikan</strong><p>Ubah parameter dan amati bagaimana gelombang merespons.</p></div><div class="mini-card"><strong>📝 3. Praktikkan</strong><p>Kerjakan aktivitas LKPD mini dan contoh soal.</p></div><div class="mini-card"><strong>💡 4. Refleksikan</strong><p>Uji pemahaman melalui kuis dan catat hal yang masih membingungkan.</p></div></div></main>${footer()}`}
function lessonPage(n){let l=lessons[n];let total=l.topics.length;return `${header()}<main class="wrap"><div class="page-head"><div class="crumb"><button onclick="go('/')">Beranda</button> / Pertemuan ${n}</div><div class="lesson-banner ${l.theme}"><div><span class="pill">PERTEMUAN 0${n} DARI 03</span><h1>${l.title}</h1><p>${l.short}</p><div class="progress-track"><div class="progress-fill" style="width:${Math.round(n/3*100)}%"></div></div><div class="notice" style="margin-top:7px">Jalur belajar: Pertemuan ${n} dari 3</div></div><div class="banner-icon">${l.icon}</div></div></div><div class="lesson-layout"><aside class="side-nav"><h4>Isi pertemuan</h4>${l.topics.map((t,i)=>`<button onclick="jump('sec${i}')" id="side${i}">${String(i+1).padStart(2,"0")} · ${t}</button>`).join("")}<button onclick="go('/pertemuan-${n===1?2:n===2?3:1}')">↗ Pilih pertemuan lain</button></aside><div class="content">
<section class="panel" id="sec0"><span class="badge">PEMANTIK</span><h2>Mulai dari rasa ingin tahu</h2><p>${l.intro}</p><div class="callout">💭 Pikirkan jawaban awalmu. Setelah mempelajari materi dan simulasi, kembali periksa apakah gagasanmu berubah.</div></section>
<section class="panel" id="sec1"><h2>🎯 Tujuan pembelajaran</h2><p>Setelah menyelesaikan pertemuan ini, kamu diharapkan mampu:</p><ol>${l.objectives.map(x=>`<li>${x}</li>`).join("")}</ol></section>
<section class="panel" id="sec2"><h2>📚 Materi inti</h2>${l.material}<div class="formula">${l.formula}</div><p class="notice">Catatan: gunakan satuan SI dan perhatikan arti setiap simbol saat menghitung.</p></section>
${n===1?simWave():n===2?simResonance()+simDoppler():simIntensity()}
<section class="panel" id="sec${n===2?5:n===1?4:4}"><h2>🧮 Contoh soal dan pembahasan</h2><p>${l.example}</p><button class="secondary" onclick="toggle('ans${n}')">Lihat pembahasan</button><div id="ans${n}" class="callout hidden">${l.answer}</div></section>
<section class="panel" id="sec${n===2?6:n===1?5:5}"><h2>📝 LKPD mini — aktivitas peserta didik</h2><p>Catat pengamatan dan simpulanmu. Jawaban tersimpan pada perangkat ini selama data browser tidak dihapus.</p><div class="activity"><label>1. Apa yang kamu ubah atau amati?<textarea id="lk${n}a" placeholder="Tuliskan variabel atau pengamatan..."></textarea></label><label>2. Apa hasil pengamatanmu?textarea<textarea id="lk${n}b" placeholder="Tuliskan hasil yang terlihat..."></textarea></label><label>3. Jelaskan hubungan hasil dengan konsep fisika.<textarea id="lk${n}c" placeholder="Tuliskan simpulan dengan bahasamu sendiri..."></textarea></label><div><button class="primary" onclick="saveWorksheet(${n})">SIMPAN JAWABAN LKPD</button><span id="saved${n}" class="notice"></span></div></div></section>
<section class="panel" id="sec${n===2?7:n===1?6:6}"><h2>✨ Kuis pemahaman</h2><p>Pilih satu jawaban terbaik pada setiap soal, lalu tekan periksa jawaban.</p><div id="quiz${n}">${l.quiz.map((q,i)=>`<div class="quiz-q"><p>${i+1}. ${q.q}</p>${q.a.map((a,j)=>`<label><input type="radio" name="q${n}_${i}" value="${j}"> ${a}</label>`).join("")}<div id="qfb${n}_${i}"></div></div>`).join("")}</div><button class="primary" onclick="gradeQuiz(${n})">PERIKSA JAWABAN</button><div id="score${n}" aria-live="polite"></div></section>
<section class="panel" id="sec${n===2?8:7}"><h2>🌷 Refleksi singkat</h2><p>Lengkapi kalimat berikut dengan jujur. Refleksi bukan untuk mencari jawaban sempurna, tetapi mengenali proses belajarmu.</p><div class="activity"><label>Hal baru yang saya pahami<textarea id="ref${n}a" placeholder="Hari ini saya memahami bahwa..."></textarea></label><label>Hal yang masih ingin saya tanyakan<textarea id="ref${n}b" placeholder="Saya masih penasaran tentang..."></textarea></label><button class="secondary" onclick="saveReflection(${n})">SIMPAN REFLEKSI</button><span class="notice" id="refsave${n}"></span></div></section>
<div class="page-nav">${n===1?`<button class="secondary" onclick="go('/')">← KEMBALI KE BERANDA</button>`:`<button class="secondary" onclick="go('/pertemuan-${n-1}')">← PERTEMUAN SEBELUMNYA</button>`}${n===3?`<button class="primary" onclick="go('/evaluasi')">LANJUT KE EVALUASI AKHIR →</button>`:`<button class="primary" onclick="markComplete(${n})">TANDAI SELESAI & LANJUT →</button>`}</div>
</div></div></main>${footer()}`}
function simWave(){return `<section class="panel" id="sec3"><h2>🧪 Simulasi gelombang bunyi</h2><p>Geser frekuensi dan panjang gelombang. Amati bentuk gelombang, lalu perhatikan nilai cepat rambat hasil perkalian keduanya.</p><div class="sim"><div class="sim-controls"><label>Frekuensi: <b id="freqVal">500 Hz</b><input id="freq" type="range" min="100" max="1000" step="50" value="500" oninput="updateWave()"></label><label>Panjang gelombang: <b id="lambdaVal">0,68 m</b><input id="lambda" type="range" min="0.2" max="1.5" step="0.02" value="0.68" oninput="updateWave()"></label></div><div class="visual-stage"><svg class="wave-svg" id="waveSvg" viewBox="0 0 700 170"><path id="wavePath" d="" fill="none" stroke="#8e65bd" stroke-width="4" stroke-linecap="round"/><line x1="0" y1="85" x2="700" y2="85" stroke="#eadff2" stroke-width="1"/></svg></div><div class="stat-row"><div class="stat">Cepat rambat model<b id="speedVal">340 m/s</b></div><div class="stat">Frekuensi<b id="freqStat">500 Hz</b></div><div class="stat">Panjang gelombang<b id="lambdaStat">0,68 m</b></div></div><p class="notice">Ilustrasi gelombang untuk memahami hubungan v = fλ; nilai parameter dapat melampaui nilai tipikal udara karena model ini untuk eksplorasi konsep.</p><div class="actions"><button class="secondary" onclick="startAR()">📷 Coba mode AR kamera</button><button class="secondary" onclick="stopAR()">Tutup mode AR</button></div><div id="arbox" class="camera-box" style="display:none;margin-top:12px"><video id="camera" autoplay playsinline muted></video><canvas id="arcanvas" class="camera-overlay"></canvas><div class="camera-caption" id="cameraCaption">Gelombang bunyi AR</div></div></div></section>`}
function simResonance(){return `<section class="panel" id="sec3"><h2>🎻 Simulasi resonansi</h2><p>Ubah frekuensi pemaksa. Amplitudo model membesar ketika frekuensi pemaksa mendekati frekuensi alami sistem.</p><div class="sim"><div class="sim-controls"><label>Frekuensi pemaksa: <b id="driveVal">440 Hz</b><input id="drive" type="range" min="200" max="700" value="440" oninput="updateResonance()"></label><label>Frekuensi alami: <b id="naturalVal">440 Hz</b><input id="natural" type="range" min="200" max="700" value="440" oninput="updateResonance()"></label></div><div class="visual-stage"><svg class="wave-svg" viewBox="0 0 700 170"><line x1="20" y1="130" x2="680" y2="130" stroke="#eadff2"/><g id="resBars"></g><text x="350" y="25" text-anchor="middle" fill="#65458b" font-size="17" font-weight="700" id="resText">Resonansi kuat!</text></svg></div><div class="stat-row"><div class="stat">Selisih frekuensi<b id="deltaRes">0 Hz</b></div><div class="stat">Amplitudo relatif<b id="ampRes">100%</b></div></div></div></section>`}
function simDoppler(){return `<section class="panel" id="sec4"><h2>🚑 Simulasi efek Doppler</h2><p>Geser kecepatan sumber untuk melihat perubahan frekuensi yang diterima pendengar diam.</p><div class="sim"><div class="sim-controls"><label>Frekuensi sirene: <b id="sirVal">600 Hz</b><input type="range" min="300" max="1000" value="600" id="sir" oninput="updateDoppler()"></label><label>Kecepatan sumber mendekat: <b id="vsVal">20 m/s</b><input type="range" min="0" max="80" value="20" id="vs" oninput="updateDoppler()"></label><label>Medium bunyi<select id="soundMedium" onchange="updateDoppler()"><option value="340">Udara (340 m/s)</option><option value="1500">Air (1500 m/s)</option></select></label></div><div class="visual-stage"><svg class="wave-svg" viewBox="0 0 700 170"><g id="dopplerWaves"></g><rect x="300" y="62" width="72" height="45" rx="12" fill="#a47bc9"/><text x="336" y="91" fill="white" text-anchor="middle" font-size="23">🔊</text><circle cx="590" cy="84" r="22" fill="#ffd9e8" stroke="#9a70c1" stroke-width="2"/><text x="590" y="91" text-anchor="middle" font-size="20">👂</text><text x="350" y="150" text-anchor="middle" fill="#6f4aa8" font-size="13">Sumber bergerak menuju pendengar</text></svg></div><div class="stat-row"><div class="stat">Frekuensi sumber<b id="sourceHz">600 Hz</b></div><div class="stat">Frekuensi terdengar<b id="heardHz">637,5 Hz</b></div></div></div></section>`}
function simIntensity(){return `<section class="panel" id="sec3"><h2>📢 Simulasi intensitas bunyi</h2><p>Model sumber titik ideal: intensitas berkurang sebanding dengan kuadrat jarak. Ubah daya sumber dan jarak pendengar.</p><div class="sim"><div class="sim-controls"><label>Daya bunyi: <b id="powerVal">1 W</b><input id="power" type="range" min="0.1" max="10" step="0.1" value="1" oninput="updateIntensity()"></label><label>Jarak dari sumber: <b id="distanceVal">2 m</b><input id="distance" type="range" min="1" max="20" step="0.5" value="2" oninput="updateIntensity()"></label></div><div class="visual-stage"><svg class="wave-svg" viewBox="0 0 700 170"><circle cx="120" cy="85" r="19" fill="#6f4aa8"/><g id="intWaves" fill="none" stroke="#a987d1" stroke-width="2"><circle cx="120" cy="85" r="38"/><circle cx="120" cy="85" r="60"/><circle cx="120" cy="85" r="82"/></g><line id="distLine" x1="120" y1="85" x2="300" y2="85" stroke="#6f4aa8" stroke-width="2" stroke-dasharray="6 5"/><circle id="listener" cx="300" cy="85" r="15" fill="#ffd9e8" stroke="#6f4aa8" stroke-width="2"/><text x="120" y="125" text-anchor="middle" fill="#6f4aa8" font-size="13">Sumber</text><text id="distLabel" x="210" y="72" text-anchor="middle" fill="#6f4aa8" font-size="13">2 m</text></svg></div><div class="stat-row"><div class="stat">Intensitas<b id="intVal">0,0199 W/m²</b></div><div class="stat">Taraf intensitas<b id="betaVal">103,0 dB</b></div></div><p class="notice">Nilai ini perhitungan model matematis ideal, bukan rekomendasi batas paparan bunyi yang aman.</p></div></section>`}
function jump(id){let el=document.getElementById(id);if(el){el.scrollIntoView({behavior:"smooth",block:"start"});document.querySelectorAll(".side-nav button").forEach(b=>b.classList.remove("active"));let idx=[...document.querySelectorAll(".side-nav button")].find(b=>b.getAttribute("onclick")===`jump('${id}')`);if(idx)idx.classList.add("active")}}
function toggle(id){document.getElementById(id)?.classList.toggle("hidden")}
function fmt(n,d=1){return Number(n).toLocaleString("id-ID",{maximumFractionDigits:d,minimumFractionDigits:0})}
function updateWave(){let f=+document.getElementById("freq").value,l=+document.getElementById("lambda").value;document.getElementById("freqVal").textContent=f+" Hz";document.getElementById("lambdaVal").textContent=fmt(l,2)+" m";document.getElementById("speedVal").textContent=fmt(f*l,1)+" m/s";document.getElementById("freqStat").textContent=f+" Hz";document.getElementById("lambdaStat").textContent=fmt(l,2)+" m";let pts=[];for(let x=0;x<=700;x+=4){let y=85-42*Math.sin(x/700*Math.PI*2*(1/l));pts.push((x===0?"M":"L")+x+" "+y)}document.getElementById("wavePath").setAttribute("d",pts.join(" "))}
function updateResonance(){let d=+document.getElementById("drive").value,n=+document.getElementById("natural").value,delta=Math.abs(d-n),amp=100/(1+Math.pow(delta/45,2));document.getElementById("driveVal").textContent=d+" Hz";document.getElementById("naturalVal").textContent=n+" Hz";document.getElementById("deltaRes").textContent=delta+" Hz";document.getElementById("ampRes").textContent=fmt(amp,0)+"%";document.getElementById("resText").textContent=delta<15?"Resonansi kuat!":delta<70?"Resonansi sedang":"Resonansi lemah";let bars="";for(let i=0;i<17;i++){let h=15+amp/100*100*Math.abs(Math.sin(i*.8));bars+=`<rect x="${45+i*37}" y="${130-h}" width="20" height="${h}" rx="5" fill="${delta<15?'#b88ad8':'#e9abc5'}"/>`}document.getElementById("resBars").innerHTML=bars}
function updateDoppler(){let f=+document.getElementById("sir").value,vs=+document.getElementById("vs").value,v=+document.getElementById("soundMedium").value;document.getElementById("sirVal").textContent=f+" Hz";document.getElementById("vsVal").textContent=vs+" m/s";document.getElementById("sourceHz").textContent=f+" Hz";document.getElementById("heardHz").textContent=fmt(f*v/(v-vs),1)+" Hz";let g="";for(let i=0;i<6;i++){g+=`<circle cx="${300-i*(35-vs*.2)}" cy="84" r="${12+i*6}" fill="none" stroke="#c09bdd" stroke-width="2"/>`}for(let i=0;i<4;i++){g+=`<circle cx="${390+i*48}" cy="84" r="${17+i*8}" fill="none" stroke="#e6a4c2" stroke-width="2"/>`}document.getElementById("dopplerWaves").innerHTML=g}
function updateIntensity(){let p=+document.getElementById("power").value,r=+document.getElementById("distance").value,I=p/(4*Math.PI*r*r),b=10*Math.log10(I/1e-12);document.getElementById("powerVal").textContent=fmt(p,1)+" W";document.getElementById("distanceVal").textContent=fmt(r,1)+" m";document.getElementById("intVal").textContent=I.toExponential(3)+" W/m²";document.getElementById("betaVal").textContent=fmt(b,1)+" dB";let x=120+Math.min(r,20)*23;document.getElementById("listener").setAttribute("cx",x);document.getElementById("distLine").setAttribute("x2",x);document.getElementById("distLabel").setAttribute("x",(120+x)/2);document.getElementById("distLabel").textContent=fmt(r,1)+" m"}
function gradeQuiz(n){let qs=lessons[n].quiz,score=0,answered=0;qs.forEach((q,i)=>{let el=document.querySelector(`input[name="q${n}_${i}"]:checked`),fb=document.getElementById(`qfb${n}_${i}`);if(!el){fb.innerHTML='<div class="feedback bad">Pilih satu jawaban terlebih dahulu.</div>';return}answered++;if(+el.value===q.c){score++;fb.innerHTML=`<div class="feedback good">✓ Benar. ${q.e}</div>`}else{fb.innerHTML=`<div class="feedback bad">Belum tepat. ${q.e}</div>`}});if(answered===qs.length){quizScores[n]=score;localStorage.setItem("soundlab_scores",JSON.stringify(quizScores));document.getElementById("score"+n).innerHTML=`<div class="feedback ${score===qs.length?'good':'bad'}">Skor kamu: ${score}/${qs.length} (${Math.round(score/qs.length*100)}%). ${score===qs.length?'Hebat! Semua jawaban tepat.':'Pelajari kembali bagian materi, lalu coba lagi.'}</div>`}else{document.getElementById("score"+n).innerHTML='<div class="feedback bad">Lengkapi semua soal agar skor dapat dihitung.</div>'}}
function saveWorksheet(n){let data={};["a","b","c"].forEach(k=>data[k]=document.getElementById(`lk${n}${k}`).value);localStorage.setItem("soundlab_lkpd_"+n,JSON.stringify(data));document.getElementById("saved"+n).textContent=" ✓ Tersimpan di perangkat ini."}
function saveReflection(n){let data={a:document.getElementById(`ref${n}a`).value,b:document.getElementById(`ref${n}b`).value};localStorage.setItem("soundlab_ref_"+n,JSON.stringify(data));document.getElementById("refsave"+n).textContent="✓ Refleksi tersimpan."}
function markComplete(n){saveDone(n);go(n===3?"/evaluasi":`/pertemuan-${n+1}`)}
async function startAR(){let box=document.getElementById("arbox");box.style.display="grid";try{cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});let v=document.getElementById("camera");v.srcObject=cameraStream;document.getElementById("cameraCaption").textContent="Mode AR aktif: amati animasi gelombang di atas tampilan kamera.";drawAR()}catch(e){document.getElementById("cameraCaption").textContent="Kamera tidak dapat dibuka. Izinkan akses kamera dan jalankan website melalui HTTPS atau localhost. Simulasi gelombang di atas tetap dapat digunakan."}}
function drawAR(){let c=document.getElementById("arcanvas");if(!c)return;let ctx=c.getContext("2d");c.width=c.clientWidth;c.height=c.clientHeight;ctx.clearRect(0,0,c.width,c.height);ctx.strokeStyle="#f4d4ff";ctx.lineWidth=3;let cx=c.width/2,cy=c.height/2;for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(cx,cy,35+i*24,18+i*15,0,0,Math.PI*2);ctx.stroke()}if(cameraStream)requestAnimationFrame(drawAR)}
function stopAR(){if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null}let b=document.getElementById("arbox");if(b)b.style.display="none"}
function evaluation(){return `${header()}<main class="wrap"><div class="crumb"><button onclick="go('/')">Beranda</button> / Evaluasi akhir</div><div class="lesson-banner l3"><div><span class="pill">RANGKUMAN PEMBELAJARAN</span><h1>Evaluasi Akhir SOUNDLAB AR</h1><p>Uji pemahamanmu tentang sumber bunyi, resonansi, efek Doppler, intensitas, dan taraf intensitas.</p></div><div class="banner-icon">🏆</div></div><section class="panel eval-card"><h2>📋 Tes akhir</h2><p>Jawab seluruh pertanyaan, lalu periksa hasilnya.</p><div id="finalQuiz">${[{q:"Bunyi termasuk gelombang…",a:["Elektromagnetik","Mekanik","Gravitasi","Statis"],c:1,e:"Bunyi membutuhkan medium."},{q:"Bunyi merambat paling cepat umumnya pada…",a:["Ruang hampa","Gas","Padatan","Semua sama"],c:2,e:"Partikel padatan umumnya berinteraksi lebih kuat sehingga gangguan bunyi dapat merambat lebih cepat."},{q:"Ketika sumber mendekati pendengar diam, frekuensi terdengar…",a:["Naik","Turun","Selalu nol","Tidak berubah dalam semua keadaan"],c:0,e:"Efek Doppler membuat frekuensi teramati naik saat sumber mendekat."},{q:"Taraf intensitas bunyi menggunakan satuan…",a:["Hertz","Watt","Desibel","Meter"],c:2,e:"Taraf intensitas diukur dalam dB."},{q:"Jika jarak dari sumber titik menjadi 3 kali, intensitas ideal menjadi…",a:["3 kali","1/3","1/6","1/9"],c:3,e:"I berbanding terbalik dengan r²."}].map((q,i)=>`<div class="quiz-q"><p>${i+1}. ${q.q}</p>${q.a.map((a,j)=>`<label><input type="radio" name="final${i}" value="${j}"> ${a}</label>`).join("")}<div id="finalfb${i}"></div></div>`).join("")}<button class="primary" onclick="gradeFinal()">PERIKSA EVALUASI</button><div id="finalScore"></div></section><div class="page-nav"><button class="secondary" onclick="go('/pertemuan-3')">← KEMBALI KE PERTEMUAN 3</button><button class="primary" onclick="go('/refleksi')">LANJUT KE REFLEKSI →</button></div></main>${footer()}`}
function gradeFinal(){let qs=[{c:1,e:"Bunyi adalah gelombang mekanik."},{c:2,e:"Bunyi umumnya lebih cepat merambat pada padatan."},{c:0,e:"Sumber mendekat membuat frekuensi teramati naik."},{c:2,e:"Taraf intensitas dinyatakan dalam dB."},{c:3,e:"I ∝ 1/r²."}],s=0,a=0;qs.forEach((q,i)=>{let v=document.querySelector(`input[name="final${i}"]:checked`),f=document.getElementById("finalfb"+i);if(!v){f.innerHTML='<div class="feedback bad">Belum dijawab.</div>';return}a++;if(+v.value===q.c)s++;f.innerHTML=`<div class="feedback ${+v.value===q.c?'good':'bad'}">${+v.value===q.c?'✓ Benar.':'Belum tepat.'} ${q.e}</div>`});if(a===qs.length)document.getElementById("finalScore").innerHTML=`<div class="feedback ${s>=4?'good':'bad'}">Nilai akhir: ${s}/5 (${s*20}/100). ${s>=4?'Bagus, pertahankan!':'Ulangi materi yang belum dikuasai dan coba lagi.'}</div>`;else document.getElementById("finalScore").innerHTML='<div class="feedback bad">Jawab semua pertanyaan terlebih dahulu.</div>'}
function reflectionPage(){return `${header()}<main class="wrap"><div class="crumb"><button onclick="go('/')">Beranda</button> / Refleksi belajar</div><div class="lesson-banner l2"><div><span class="pill">JEDA SEJENAK</span><h1>Refleksi perjalanan belajar</h1><p>Kenali konsep yang sudah dipahami, tantangan yang ditemui, dan langkah belajar berikutnya.</p></div><div class="banner-icon">🌷</div></div><section class="panel eval-card"><h2>Bagaimana pengalaman belajarmu?</h2><div class="activity"><label>1. Konsep yang paling saya pahami<textarea id="overall1" placeholder="Saya sekarang memahami..."></textarea></label><label>2. Konsep yang masih membingungkan<textarea id="overall2" placeholder="Saya masih perlu berlatih..."></textarea></label><label>3. Contoh penerapan bunyi di kehidupan sehari-hari<textarea id="overall3" placeholder="Contoh yang saya temukan..."></textarea></label><label>Seberapa percaya diri kamu? <select id="confidence"><option>Saya masih perlu bantuan</option><option>Saya cukup paham</option><option>Saya sangat percaya diri</option></select></label><button class="primary" onclick="saveOverall()">SIMPAN REFLEKSI</button><div id="overallSaved" class="notice"></div></div></section><section class="panel eval-card"><h2>📈 Ringkasan kemajuan</h2><p>Pertemuan selesai: <b>${doneLessons.size}/3</b> · Kuis pertemuan: <b>${Object.keys(quizScores).length}/3 dikerjakan</b></p><div class="progress-track"><div class="progress-fill" style="width:${progress()}%"></div></div><div class="actions"><button class="secondary" onclick="go('/')">KEMBALI KE BERANDA</button><button class="primary" onclick="go('/evaluasi')">BUKA EVALUASI AKHIR</button></div></section></main>${footer()}`}
function saveOverall(){let d={a:document.getElementById("overall1").value,b:document.getElementById("overall2").value,c:document.getElementById("overall3").value,confidence:document.getElementById("confidence").value};localStorage.setItem("soundlab_overall",JSON.stringify(d));document.getElementById("overallSaved").textContent="✓ Refleksi akhir tersimpan di perangkat ini."}
function restoreInputs(n){["a","b","c"].forEach(k=>{let el=document.getElementById(`lk${n}${k}`);if(el)el.value=JSON.parse(localStorage.getItem("soundlab_lkpd_"+n)||"{}")[k]||""});["a","b"].forEach(k=>{let el=document.getElementById(`ref${n}${k}`);if(el)el.value=JSON.parse(localStorage.getItem("soundlab_ref_"+n)||"{}")[k]||""})}
function render(){let p=path(),app=document.getElementById("app");if(p==="/")app.innerHTML=home();else if(/^\/pertemuan-[123]$/.test(p)){let n=+p.slice(-1);app.innerHTML=lessonPage(n);if(n===1)updateWave();if(n===2){updateResonance();updateDoppler()}if(n===3)updateIntensity();restoreInputs(n)}else if(p==="/evaluasi")app.innerHTML=evaluation();else if(p==="/refleksi")app.innerHTML=reflectionPage();else{history.replaceState({},"","/");app.innerHTML=home()}}
render();
</script></body></html>
